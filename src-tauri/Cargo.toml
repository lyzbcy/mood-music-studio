[package]
name = "mood-music-studio"
version = "0.0.1"
description = "Music auto-tagging + AI scoring studio"
authors = ["泽恩 <lyzbcy@gmail.com>"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "mood_music_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["protocol-asset"] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
thiserror = "1"

[features]
# 默认启用自定义协议（生产）
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
